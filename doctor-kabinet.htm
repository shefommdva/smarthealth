<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Həkim Kabineti | SmartHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <link rel="stylesheet" href="assets/modern-redesign.css">
    <link rel="stylesheet" href="assets/site-navbar.css">
    <link rel="stylesheet" href="assets/site-footer.css">
    
    <style>
        .dashboard-body {
            background: #f8fafc;
            min-height: 100vh;
            padding-top: 120px;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 32px;
            padding: 0 8% 100px;
        }

        /* Sidebar Styles */
        .sidebar-glass {
            padding: 32px;
            height: fit-content;
            position: sticky;
            top: 120px;
        }

        .profile-section {
            text-align: center;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .profile-img-wrap {
            width: 100px;
            height: 100px;
            border-radius: 30px;
            margin: 0 auto 15px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.2);
        }

        .nav-menu { list-style: none; }
        .nav-menu li { margin-bottom: 8px; }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: 16px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(14, 165, 233, 0.08);
            color: var(--primary);
        }

        /* Content Styles */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Table Redesign */
        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
        }

        .data-table th {
            padding: 10px 24px;
            text-align: left;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
        }

        .data-table tr td {
            background: white;
            padding: 20px 24px;
            border-top: 1px solid rgba(0,0,0,0.03);
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }

        .data-table tr td:first-child { border-left: 1px solid rgba(0,0,0,0.03); border-radius: 20px 0 0 20px; }
        .data-table tr td:last-child { border-right: 1px solid rgba(0,0,0,0.03); border-radius: 0 20px 20px 0; }

        .badge {
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-pending { background: #fff7ed; color: #c2410c; }
        .badge-done { background: #f0fdf4; color: #15803d; }

        @media (max-width: 1024px) {
            .dashboard-container { grid-template-columns: 1fr; }
            .sidebar-glass { position: relative; top: 0; }
        }
    </style>
</head>
<body class="dashboard-body">

    <div class="island-nav-wrapper">
        <nav class="island-nav">
            <a href="homepage.htm" class="logo"><i class="fa-solid fa-staff-snake"></i> SmartHealth</a>
            <div class="nav-links">
                <a href="clinics.htm">Klinikalar</a>
                <a href="help.htm">Dəstək</a>
            </div>
            <button onclick="logout()" class="btn-pill btn-ghost">Çıxış</button>
        </nav>
    </div>

    <main class="dashboard-container">
        <aside class="sidebar-glass glass-panel fade-up">
            <div class="profile-section">
                <div class="profile-img-wrap">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>
                <h3 id="drName" style="font-size: 18px; margin-bottom: 4px;">Həkim yüklənir...</h3>
                <p id="drSpecialty" style="font-size: 14px; color: var(--text-secondary);">İxtisas</p>
            </div>

            <ul class="nav-menu">
                <li><a href="#" class="nav-link active"><i class="fa-solid fa-calendar-check"></i> Qəbullar</a></li>
                <li><a href="#" class="nav-link"><i class="fa-solid fa-clock"></i> İş qrafiki</a></li>
                <li><a href="#" class="nav-link"><i class="fa-solid fa-wallet"></i> Balans</a></li>
                <li><a href="#" class="nav-link"><i class="fa-solid fa-gear"></i> Ayarlar</a></li>
            </ul>
        </aside>

        <section class="stagger-cards">
            <div class="stats-grid">
                <div class="stat-card glass-card">
                    <div class="stat-icon" style="background: rgba(14, 165, 233, 0.1); color: var(--primary);">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <div>
                        <div style="font-size: 13px; color: var(--text-secondary);">Ümumi Pasient</div>
                        <div style="font-size: 24px; font-weight: 700;" id="totalPatients">0</div>
                    </div>
                </div>
                <div class="stat-card glass-card">
                    <div class="stat-icon" style="background: rgba(34, 197, 94, 0.1); color: #22c55e;">
                        <i class="fa-solid fa-calendar-day"></i>
                    </div>
                    <div>
                        <div style="font-size: 13px; color: var(--text-secondary);">Bugünkü Qəbul</div>
                        <div style="font-size: 24px; font-weight: 700;" id="todayCount">0</div>
                    </div>
                </div>
                <div class="stat-card glass-card">
                    <div class="stat-icon" style="background: rgba(168, 85, 247, 0.1); color: #a855f7;">
                        <i class="fa-solid fa-lira-sign"></i>
                    </div>
                    <div>
                        <div style="font-size: 13px; color: var(--text-secondary);">Aylıq Gəlir</div>
                        <div style="font-size: 24px; font-weight: 700;" id="monthlyIncome">0 ₼</div>
                    </div>
                </div>
            </div>

            <div class="glass-card" style="padding: 32px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h2 style="font-size: 20px; font-weight: 700;">Son Qəbullar</h2>
                    <button onclick="addMockAppointment()" class="btn-pill btn-primary" style="padding: 8px 20px; font-size: 13px;">
                        <i class="fa-solid fa-plus"></i> Yeni Qeyd
                    </button>
                </div>

                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>PASİENT</th>
                                <th>XİDMƏT</th>
                                <th>TARİX/VAXT</th>
                                <th>STATUS</th>
                                <th>ƏMƏLİYYAT</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentTable">
                            </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/modern-redesign.js"></script>
        <script src="assets/site-navbar.js"></script>
    <script src="assets/site-footer.js"></script>
<script>
        // Integration with your existing data logic
        let currentProfile = JSON.parse(localStorage.getItem('doctorProfile')) || {
            name: "Dr. Ziyad Muradov",
            specialty: "Kardioloq",
            appointments: [
                { patient: 'Nigar Həsənli', service: 'Kardiogram', date: '2026-05-10', time: '12:00', status: 'Gözləmədə', price: 45 },
                { patient: 'Elnur Quliyev', service: 'Müayinə', date: '2026-05-09', time: '10:30', status: 'Tamamlandı', price: 30 }
            ]
        };

        function renderDashboard() {
            document.getElementById('drName').innerText = currentProfile.name;
            document.getElementById('drSpecialty').innerText = currentProfile.specialty;
            
            const table = document.getElementById('appointmentTable');
            table.innerHTML = (currentProfile.appointments || []).map((app, index) => `
                <tr>
                    <td>
                        <div style="font-weight: 600;">${app.patient}</div>
                        <div style="font-size: 12px; color: var(--text-secondary);">ID: #SH-${1000 + index}</div>
                    </td>
                    <td style="font-size: 14px;">${app.service}</td>
                    <td>
                        <div style="font-weight: 500;">${app.date}</div>
                        <div style="font-size: 12px; color: var(--primary);">${app.time}</div>
                    </td>
                    <td>
                        <span class="badge ${app.status === 'Gözləmədə' ? 'badge-pending' : 'badge-done'}">
                            ${app.status}
                        </span>
                    </td>
                    <td>
                        <div style="display: flex; gap: 8px;">
                            <button onclick="updateStatus(${index})" class="btn-pill btn-ghost" style="padding: 6px 12px; font-size: 12px;">Yenilə</button>
                            <button onclick="remove(${index})" style="background: none; border: none; color: #ef4444; cursor: pointer; padding: 5px;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');

            // Update stats
            document.getElementById('totalPatients').innerText = currentProfile.appointments.length;
            document.getElementById('todayCount').innerText = currentProfile.appointments.filter(a => a.status === 'Gözləmədə').length;
            const income = currentProfile.appointments.reduce((sum, a) => sum + (a.price || 0), 0);
            document.getElementById('monthlyIncome').innerText = income + ' ₼';
        }

        function addMockAppointment() {
            currentProfile.appointments.unshift({ 
                patient: 'Yeni Pasient', 
                service: 'Məsləhət', 
                date: '2026-05-11', 
                time: '14:00', 
                status: 'Gözləmədə', 
                price: 50 
            });
            renderDashboard();
        }

        function logout() {
            window.location.href = 'homepage.htm';
        }

        document.addEventListener('DOMContentLoaded', renderDashboard);
    </script>
</body>
</html>
