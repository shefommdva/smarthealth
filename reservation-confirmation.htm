<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezervasiya Təsdiqləndi | SmartHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <link rel="stylesheet" href="assets/modern-redesign.css">
    
        <link rel="stylesheet" href="assets/site-navbar.css">
    <link rel="stylesheet" href="assets/site-footer.css">
<style>
        .confirmation-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px;
            background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.05), transparent 40%);
        }

        .confirmation-card {
            width: 100%;
            max-width: 600px;
            text-align: center;
            padding: 60px 40px;
            position: relative;
        }

        .success-checkmark {
            width: 80px;
            height: 80px;
            background: #10b981;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 32px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

        .appointment-details {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 24px;
            padding: 32px;
            margin: 32px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            text-align: left;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .detail-item label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .detail-item span {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 32px;
        }

        .calendar-invite {
            grid-column: 1 / -1;
            padding: 16px;
            background: #f0fdf4;
            border: 1px dashed #10b981;
            border-radius: 14px;
            color: #065f46;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .calendar-invite:hover {
            background: #dcfce7;
        }

        @media (max-width: 480px) {
            .appointment-details { grid-template-columns: 1fr; }
            .action-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="island-nav-wrapper">
        <nav class="island-nav">
            <a href="homepage.htm" class="logo"><i class="fa-solid fa-staff-snake"></i> SmartHealth</a>
            <div class="nav-links">
                <a href="doctors.htm">Həkimlər</a>
                <a href="help.htm">Kömək</a>
            </div>
            <a href="Şəxsikabinet.htm" class="btn-pill btn-ghost">Profil</a>
        </nav>
    </div>

    <main class="confirmation-page">
        <div class="confirmation-card glass-card fade-up">
            <div class="success-checkmark">
                <i class="fa-solid fa-check"></i>
            </div>
            
            <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 12px;">Randevunuz Təsdiqləndi!</h1>
            <p style="color: var(--text-secondary); font-size: 16px;">Təşəkkür edirik. Rezervasiya məlumatları email ünvanınıza göndərildi.</p>

            <div class="appointment-details" id="detailsContainer">
                <div class="detail-item">
                    <label>Həkim</label>
                    <span id="docName">Yüklənir...</span>
                </div>
                <div class="detail-item">
                    <label>Tarix və Vaxt</label>
                    <span id="apptTime">Yüklənir...</span>
                </div>
                <div class="detail-item">
                    <label>Klinika</label>
                    <span id="clinicName">Yüklənir...</span>
                </div>
                <div class="detail-item">
                    <label>Xidmət Növü</label>
                    <span id="visitType">Klinik qəbul</span>
                </div>
            </div>

            <a href="#" class="calendar-invite">
                <i class="fa-regular fa-calendar-plus"></i> Təqvimə əlavə et (Google Calendar)
            </a>

            <div class="action-grid">
                <a href="homepage.htm" class="btn-pill btn-ghost" style="text-align: center;">Ana Səhifə</a>
                <a href="Şəxsikabinet.htm" class="btn-pill btn-primary" style="text-align: center;">Kabinetə Bax</a>
            </div>
        </div>
    </main>

    <script src="assets/smarthealth-doctors.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const docId = params.get('id');
            const slot = params.get('slot');
            
            // Fallback for static demo
            const doctor = (window.SmartHealthDoctors || []).find(d => String(d.id) === docId) || {
                name: "Dr. Murad Muradov",
                clinic: "Baku Medical Center",
                nextAvailable: "12 May, 14:00"
            };

            document.getElementById('docName').textContent = doctor.name;
            document.getElementById('apptTime').textContent = slot || doctor.nextAvailable;
            document.getElementById('clinicName').textContent = doctor.clinic;

            // Entrance animation
            gsap.from(".success-checkmark", {
                scale: 0,
                rotation: -180,
                duration: 1,
                ease: "back.out(1.7)",
                delay: 0.2
            });

            gsap.from(".detail-item", {
                opacity: 0,
                y: 20,
                stagger: 0.1,
                duration: 0.8,
                ease: "power2.out",
                delay: 0.5
            });
        });
    </script>
    <script src="assets/site-navbar.js"></script>
    <script src="assets/site-footer.js"></script>
</body>
</html>
