<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifrəni bərpa et | SmartHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <link rel="stylesheet" href="assets/modern-redesign.css">
    
        <link rel="stylesheet" href="assets/site-navbar.css">
    <link rel="stylesheet" href="assets/site-footer.css">
<style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: radial-gradient(circle at top left, rgba(14, 165, 233, 0.08), transparent 40%);
        }

        .auth-card-modern {
            width: 100%;
            max-width: 440px;
            padding: 48px;
            text-align: center;
        }

        .auth-brand-icon {
            width: 64px;
            height: 64px;
            background: rgba(14, 165, 233, 0.1);
            color: var(--primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 24px;
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 18px;
            color: var(--primary);
            opacity: 0.5;
        }

        .auth-input {
            width: 100%;
            padding: 16px 16px 16px 50px;
            border-radius: 14px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(255,255,255,0.5);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        .success-state {
            display: none;
        }
    </style>
</head>
<body>

    <div class="island-nav-wrapper">
        <nav class="island-nav">
            <a href="homepage.htm" class="logo"><i class="fa-solid fa-staff-snake"></i> SmartHealth</a>
            <a href="login.htm" class="btn-pill btn-ghost">Geri qayıt</a>
        </nav>
    </div>

    <main class="auth-page">
        <div id="resetRequestCard" class="auth-card-modern glass-card fade-up">
            <div class="auth-brand-icon">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 12px;">Şifrəni bərpa et</h1>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 32px;">
                Email ünvanınızı daxil edin, biz sizə şifrəni yeniləmək üçün link göndərəcəyik.
            </p>

            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="resetEmail" class="auth-input" placeholder="Email ünvanınız" required>
            </div>

            <button onclick="sendResetEmail()" id="resetBtn" class="btn-pill btn-primary" style="width: 100%; padding: 16px;">
                Link göndər
            </button>
        </div>

        <div id="successCard" class="auth-card-modern glass-card success-state">
            <div class="auth-brand-icon" style="background: rgba(16, 185, 129, 0.1); color: #10b981;">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 12px;">Email göndərildi</h1>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 32px;">
                Zəhmət olmasa, gələn qutunuzu yoxlayın. Link 1 saat ərzində qüvvədədir.
            </p>
            <a href="login.htm" class="btn-pill btn-primary" style="width: 100%; display: block; text-decoration: none;">Giriş səhifəsinə qayıt</a>
        </div>
    </main>

    <script>
        // Firebase Config (Keeping your original credentials)
        const firebaseConfig = {
            apiKey: "AIzaSyCDo3MFtj9qYwEbKRwKu5v7SBhmpk2eyIE",
            authDomain: "smarthealth-d9c8b.firebaseapp.com",
            projectId: "smarthealth-d9c8b",
            storageBucket: "smarthealth-d9c8b.firebasestorage.app",
            messagingSenderId: "908166581668",
            appId: "1:908166581668:web:57c6372500cd5da6478531",
            measurementId: "G-R09T8978G5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function sendResetEmail() {
            const email = document.getElementById('resetEmail').value.trim();
            const btn = document.getElementById('resetBtn');

            if (!email) {
                gsap.fromTo("#resetEmail", { x: -10 }, { x: 0, duration: 0.1, repeat: 5 });
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Göndərilir...';

            auth.sendPasswordResetEmail(email)
                .then(() => {
                    // Transition to success card
                    gsap.to("#resetRequestCard", { opacity: 0, y: 20, duration: 0.4, onComplete: () => {
                        document.getElementById('resetRequestCard').style.display = 'none';
                        const successCard = document.getElementById('successCard');
                        successCard.style.display = 'block';
                        gsap.fromTo(successCard, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5 });
                    }});
                })
                .catch((error) => {
                    console.error('Reset error:', error);
                    btn.disabled = false;
                    btn.textContent = 'Yenidən yoxlayın';
                    alert(error.message);
                });
        }

        // Entrance Animation
        gsap.from(".auth-card-modern", { opacity: 0, y: 30, duration: 0.8, ease: "power3.out" });
    </script>
    <script src="assets/site-navbar.js"></script>
    <script src="assets/site-footer.js"></script>
</body>
</html>
